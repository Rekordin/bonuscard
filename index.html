<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пиала CUP · Бонусные карточки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#180b0c;--panel:#271315;--line:#472225;--ink:#faf1f2;--muted:#af9b86;--gold:#deb56f;--red:#e5122b;--boost:#5fbf7a;--debuff:#e5485a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#3a1518,transparent),var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;min-height:100vh}
button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}
.mono{font-family:"Rubik Mono One",Inter,Arial,sans-serif;font-weight:400}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;border-bottom:2px solid var(--line);background:#1f0e10;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px}.brand b{font-size:17px;letter-spacing:.12em}.brand b span{color:var(--gold)}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.24em;margin-top:5px}
.stats{display:flex;gap:18px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#c9beaa}.stats b{color:var(--ink);font-size:14px}.stats .bo b{color:var(--boost)}.stats .de b{color:var(--debuff)}
main{max-width:1280px;margin:0 auto;padding:26px 22px 60px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}
.eyebrow{color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.22em}
h1{font-size:clamp(22px,3vw,36px);margin:8px 0 6px}h1 .gold{color:var(--gold)}
.lead{color:#c2b6a0;margin:0 0 18px;line-height:1.5;max-width:720px}
.who{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.who label{font-size:10px;font-weight:600;letter-spacing:.14em;color:#beb19a}
select,input[type=text]{background:#1d0d0f;color:var(--ink);border:2px solid #5a2a2f;padding:10px 12px;min-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px}
.c{aspect-ratio:.72;border:2px solid #6b3138;background:repeating-linear-gradient(135deg,#2c1316 0 8px,#331619 8px 16px);position:relative;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s;padding:0}
.c::before{content:"";position:absolute;inset:6px;border:1px solid #8a4a3a55}
.c span{font-size:15px;color:var(--gold);position:relative}
.c:not(:disabled):hover{transform:translateY(-3px);border-color:var(--gold)}
.c.open{background:#1a0d0e;border-color:#3a1c1f;opacity:.72}.c.open::before{display:none}
.c.open.boost{border-color:#2f6b40}.c.open.debuff{border-color:#7a2a33}
.c.open span{font-family:Inter;font-size:9px;font-weight:700;line-height:1.25;color:#e9dccb;padding:4px;text-align:center}
.c.open.boost em,.c.open.debuff em{position:absolute;top:5px;left:0;right:0;text-align:center;font-style:normal;font-size:8px;letter-spacing:.12em;font-weight:700}
.c.open.boost em{color:var(--boost)}.c.open.debuff em{color:var(--debuff)}
aside .panel{background:var(--panel);border:2px solid var(--line)}
.ptitle{padding:14px 18px;border-bottom:2px solid #51262a;font-size:11px;font-weight:600;letter-spacing:.18em;display:flex;justify-content:space-between}
.hist{list-style:none;margin:0;padding:0;max-height:62vh;overflow:auto}.hist li{padding:11px 18px;border-bottom:1px solid #51262a;font-size:12px;line-height:1.4}
.hist li b{display:block;font-size:13px}.hist li .t{font-size:9px;font-weight:700;letter-spacing:.12em}.hist li .t.boost{color:var(--boost)}.hist li .t.debuff{color:var(--debuff)}.hist li small{color:var(--muted)}
.empty{padding:18px;color:var(--muted);font-size:12px}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{border:2px solid var(--gold);background:var(--gold);color:#1d0d0f;font-weight:700;letter-spacing:.1em;padding:12px 16px;font-size:11px}
.btn.ghost{background:transparent;color:var(--gold)}.btn.red{background:transparent;border-color:#8a3a42;color:#f0b7bd}
.modal{position:fixed;inset:0;background:#0c0506d9;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:var(--panel);border:2px solid #70343a;max-width:440px;width:100%;padding:24px;text-align:center}
.box h3{margin:0 0 8px;font-size:16px}.box p{color:#c2b6a0;margin:0 0 18px;line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.flip{perspective:1200px;width:300px;height:420px;margin:0 auto 18px}
.inner{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.go .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.back{background:repeating-linear-gradient(135deg,#2c1316 0 10px,#351719 10px 20px)}.back img{width:110px;opacity:.9}.back .n{margin-top:16px;color:var(--gold);font-size:28px}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#2f1518,#1a0b0d)}
.front.boost{border-color:var(--boost);box-shadow:0 0 60px #5fbf7a44}.front.debuff{border-color:var(--debuff);box-shadow:0 0 60px #e5485a44}
.front .tag{font-size:12px;letter-spacing:.2em;padding:6px 12px;border:2px solid currentColor;margin-bottom:18px}
.front.boost .tag{color:var(--boost)}.front.debuff .tag{color:var(--debuff)}
.front .ttl{font-size:21px;line-height:1.25;margin-bottom:14px}.front .txt{font-size:15px;line-height:1.5;color:#efe3d3}.front .meta{margin-top:auto;color:var(--muted);font-size:11px;letter-spacing:.12em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b3a2b;border:2px solid #4f7a4f;padding:10px 16px;font-size:13px;z-index:30}
.c.open.empty{border-color:#4a4040}.c.open.empty em{position:absolute;top:5px;left:0;right:0;text-align:center;font-style:normal;font-size:8px;letter-spacing:.12em;font-weight:700;color:#a99}
.hist li .t.empty{color:#a99}.stats .em b{color:#cbbcbc}
.front.empty{border-color:#8f8484;box-shadow:0 0 50px #ffffff18}.front.empty .tag{color:#cbbcbc}
.streamlink{display:inline-block;margin:0 0 16px;color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.1em}
body.stream{overflow:hidden}
.st-wrap{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 30vw;gap:2vw;padding:2.2vw 2.4vw}
.st-head{display:flex;align-items:center;gap:1vw;margin-bottom:1.4vw}.st-head img{width:3.4vw;height:3.4vw}.st-head b{font-size:2vw;letter-spacing:.12em}.st-head b span{color:var(--gold)}.st-head small{display:block;color:var(--muted);font-size:.8vw;letter-spacing:.24em;margin-top:.3vw}
.st-grid{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));gap:.4vw}.st-grid .c{aspect-ratio:auto;height:calc((100vh - 4.4vw - 5vw - 3.2vw) / 8);min-width:0;overflow:hidden}
.st-grid .c{cursor:default}.st-grid .c span{font-size:.95vw}.st-grid .c.open span{font-size:.62vw}.st-grid .c.open em{font-size:.5vw!important}
.st-side{display:flex;flex-direction:column;gap:1vw;min-height:0}
.st-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5vw}.st-stats div{background:var(--panel);border:2px solid var(--line);padding:.8vw;text-align:center}.st-stats span{display:block;font-size:.7vw;letter-spacing:.16em;color:var(--muted)}.st-stats b{font-size:2vw}
.st-last{background:var(--panel);border:2px solid var(--line);flex:1;min-height:0;overflow:hidden}.st-last h4{margin:0;padding:.9vw 1.1vw;font-size:.8vw;letter-spacing:.18em;border-bottom:2px solid #51262a}
.st-last li{list-style:none;padding:.8vw 1.1vw;border-bottom:1px solid #51262a;font-size:.85vw}.st-last ul{margin:0;padding:0}.st-last li b{display:block;font-size:1vw}.st-last .t{font-size:.65vw;letter-spacing:.12em;font-weight:700}.st-last .t.boost{color:var(--boost)}.st-last .t.debuff{color:var(--debuff)}.st-last .t.empty{color:#a99}
.st-reveal{position:fixed;inset:0;background:#0c0506e6;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40}
.st-reveal .who{font-size:2vw;color:var(--gold);margin-bottom:2vw;letter-spacing:.1em}
.st-reveal .flip{width:24vw;height:33.6vw}.st-reveal .front .ttl{font-size:2vw}.st-reveal .front .txt{font-size:1.4vw}.st-reveal .front .tag{font-size:1.1vw}.st-reveal .back .n{font-size:2.6vw}.st-reveal .back img{width:9vw}
.c.open.sboost{border-color:#f5c542;box-shadow:0 0 14px #f5c54255}.c.open.sdebuff{border-color:#a23bd6;box-shadow:0 0 14px #a23bd655}
.c.open.sboost em,.c.open.sdebuff em{position:absolute;top:5px;left:0;right:0;text-align:center;font-style:normal;font-size:7px;letter-spacing:.06em;font-weight:800}.c.open.sboost em{color:#f5c542}.c.open.sdebuff em{color:#c77dff}
.hist li .t.sboost,.st-last .t.sboost{color:#f5c542}.hist li .t.sdebuff,.st-last .t.sdebuff{color:#c77dff}
.front.sboost{border-color:#f5c542;background:radial-gradient(circle at 50% 30%,#4a3a10,#1a0b0d 70%);box-shadow:0 0 90px #f5c54288,0 0 30px #fff3}.front.sboost .tag{color:#f5c542}
.front.sdebuff{border-color:#a23bd6;background:radial-gradient(circle at 50% 30%,#3a1050,#14070f 70%);box-shadow:0 0 90px #a23bd688}.front.sdebuff .tag{color:#c77dff}
.stats .su b{color:#f5c542}
@media(max-width:900px){main{grid-template-columns:1fr}.grid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}.c span{font-size:12px}.flip{width:260px;height:370px}}
</style>
</head>

${reveal?`<div class="st-reveal"><div class="who mono">${esc(reveal.who)}</div><div class="flip ${reveal.go?"go":""}"><div class="inner"><div class="face back"><img src="${LOGO}" alt=""><div class="n mono">№${reveal.n}</div></div><div class="face front ${reveal.type}"><div class="tag mono">${label(reveal.type)}</div><div class="ttl mono">${esc(reveal.title)}</div><div class="txt">${esc(reveal.text)}</div><div class="meta">КАРТОЧКА №${reveal.n}</div></div></div></div></div>`:""}`}
function showReveal(h){reveal={...h,go:false};renderStream();clearTimeout(revealTimer);setTimeout(()=>{if(reveal){reveal.go=true;document.querySelector(".st-reveal .flip")?.classList.add("go")}},700);revealTimer=setTimeout(()=>{reveal=null;renderStream()},9000)}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.deck)&&s.deck.length===POOL.length&&s.v===CARDS.length)st=s}catch{}}
function route(){if(isStream()){load();lastSeen=st.history.length;renderStream()}else{document.body.classList.remove("stream");render()}}
window.addEventListener("storage",e=>{if(e.key!==KEY)return;load();if(isStream()){if(st.history.length>lastSeen){const h=st.history[st.history.length-1];lastSeen=st.history.length;showReveal(h)}else{lastSeen=st.history.length;renderStream()}}else if(!modal)render()});
window.addEventListener("hashchange",route);
setInterval(()=>{if(!isStream())return;const before=JSON.stringify(st.history.length)+Object.keys(st.opened).length;load();const now=JSON.stringify(st.history.length)+Object.keys(st.opened).length;if(before!==now){if(st.history.length>lastSeen){lastSeen=st.history.length;showReveal(st.history[st.history.length-1])}else{lastSeen=st.history.length;if(!reveal)renderStream()}}},1500);
route();
})();
</script>
</body>
